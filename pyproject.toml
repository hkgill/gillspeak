[project]
name = "gillspeak"
version = "0.5.1"
description = "Self-hosted dictation: hotkey, talk, clean text at your cursor. Local ASR, Gemini Flash-Lite cleanup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "sounddevice>=0.4.7",
  "sherpa-onnx>=1.12",
  "httpx[http2]>=0.27",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
gillspeak = "gillspeak.cli:main"
gillspeakd = "gillspeak.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gillspeak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "E501",    # long lines are wrapped by judgement, not a counter
  "RUF001", "RUF002", "RUF003",  # intentional Unicode (→, —, …, emoji) in user-facing text
  "SIM105",  # try/except/pass is clearer than contextlib.suppress in hot paths
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["gillspeak"]
