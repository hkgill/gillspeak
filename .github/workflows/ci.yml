name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff
        run: uvx ruff check .
      - name: shellcheck
        run: uvx --from shellcheck-py shellcheck scripts/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv -p ${{ matrix.python }}
          uv pip install -e '.[dev]' pytest-cov
      - name: Test
        run: .venv/bin/pytest -q --cov --cov-report=term-missing:skip-covered

  fedora:
    # The supported platform: run the suite on the current Fedora release.
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: System packages
        run: dnf install -y --setopt=install_weak_deps=False git python3 uv
      - uses: actions/checkout@v4
      - name: Install
        # Fedora's own python3 (what users run); Fedora's uv doesn't download interpreters.
        run: |
          uv venv -p /usr/bin/python3
          uv pip install -e '.[dev]'
      - name: Test
        run: .venv/bin/pytest -q
      - name: Build wheel
        run: |
          uv build --wheel
          python3 -m zipfile -l dist/*.whl | grep -E 'murmur/(evals/llm_eval.jsonl|keyd.py|assets/sounds/start.wav)'
